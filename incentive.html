<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>A+ Incentive</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0f;--bg2:#111118;--bg3:#18181f;--bg4:#20202a;
  --border:#2a2a38;--border2:#38384a;
  --accent:#7c6ff7;--accent2:#a99ef8;
  --green:#34d399;--red:#f87171;--yellow:#fbbf24;--blue:#60a5fa;--orange:#fb923c;
  --text:#e8e8f0;--text2:#9898b0;--text3:#606078;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;}

/* HEADER */
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.header-title{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:var(--accent2);}
.header-right{display:flex;align-items:center;gap:8px;}

/* BTN */
.btn{padding:7px 14px;border-radius:6px;border:none;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:#6b5ee0;}
.btn-ghost{background:var(--bg3);color:var(--text2);border:1px solid var(--border2);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-green{background:rgba(52,211,153,0.15);color:var(--green);border:1px solid rgba(52,211,153,0.3);}

/* SCREEN */
.screen{display:none;padding:16px;}
.screen.active{display:block;}

/* STAFF GRID */
.staff-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:12px;}
.staff-btn{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px 8px;text-align:center;cursor:pointer;transition:all .15s;font-size:13px;font-weight:600;}
.staff-btn:hover,.staff-btn:active{border-color:var(--accent);background:rgba(124,111,247,0.1);color:var(--accent2);}
.staff-btn.manager{border-color:rgba(251,191,36,0.3);color:var(--yellow);}

/* SECTION TITLE */
.sec-title{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:10px;}

/* MONTH BAR */
.month-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.month-btn{padding:5px 12px;border-radius:20px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);font-size:12px;cursor:pointer;}
.month-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}

/* TABLE */
.inc-table-wrap{overflow-x:auto;margin-bottom:12px;}
.inc-table{border-collapse:collapse;width:100%;min-width:600px;font-size:12px;}
.inc-table th{background:var(--bg3);border:1px solid var(--border);padding:7px 8px;text-align:center;color:var(--text3);font-weight:700;white-space:nowrap;position:sticky;top:0;}
.inc-table th:first-child{position:sticky;left:0;z-index:2;background:var(--bg3);}
.inc-table td{border:1px solid var(--border);padding:0;text-align:center;position:relative;}
.inc-table td:first-child{background:var(--bg2);font-weight:600;padding:6px 8px;white-space:nowrap;position:sticky;left:0;z-index:1;}
.inc-table tr:hover td{background:rgba(124,111,247,0.04);}
.inc-table tr:hover td:first-child{background:var(--bg2);}
.cell-input{width:100%;height:36px;background:transparent;border:none;color:var(--text);font-size:12px;text-align:center;font-family:'JetBrains Mono',monospace;padding:0 4px;outline:none;}
.cell-input:focus{background:rgba(124,111,247,0.1);}
.total-row td{background:var(--bg3)!important;font-weight:700;color:var(--accent2);font-family:'JetBrains Mono',monospace;}
.total-row td:first-child{color:var(--text2);}

/* CALC BTN in cell */
.calc-trigger{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:16px;height:16px;border-radius:3px;background:rgba(124,111,247,0.2);border:none;color:var(--accent2);font-size:9px;cursor:pointer;display:none;align-items:center;justify-content:center;padding:0;}
td:hover .calc-trigger{display:flex;}

/* SUMMARY CARDS */
.sum-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:14px;}
.sum-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
.sum-label{font-size:10px;color:var(--text3);margin-bottom:4px;}
.sum-value{font-size:16px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--accent2);}

/* CALCULATOR MODAL */
.calc-modal{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:none;align-items:flex-end;justify-content:center;}
.calc-modal.show{display:flex;}
.calc-box{background:var(--bg2);border-radius:16px 16px 0 0;border:1px solid var(--border);width:100%;max-width:360px;padding:16px;}
.calc-display{background:var(--bg3);border-radius:8px;padding:10px 14px;margin-bottom:12px;text-align:right;}
.calc-expr{font-size:11px;color:var(--text3);min-height:16px;}
.calc-result{font-size:24px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--text);}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.calc-key{height:52px;border-radius:8px;border:none;font-size:16px;font-weight:600;cursor:pointer;font-family:'JetBrains Mono',monospace;transition:all .1s;}
.calc-key:active{transform:scale(0.95);}
.k-num{background:var(--bg3);color:var(--text);}
.k-op{background:rgba(124,111,247,0.2);color:var(--accent2);}
.k-eq{background:var(--accent);color:#fff;}
.k-clear{background:rgba(248,113,113,0.2);color:var(--red);}
.k-ok{background:var(--green);color:#000;font-size:13px;}
.k-dash{background:var(--bg3);color:var(--text3);}

/* ADD ROW */
.add-row-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
.date-input{background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-size:13px;padding:6px 10px;font-family:'Noto Sans KR',sans-serif;}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 16px;font-size:12px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.show{opacity:1;}

/* STAFF MGMT */
.staff-mgmt{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.staff-tag{display:inline-flex;align-items:center;gap:4px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:12px;}
.staff-tag.mgr{border-color:rgba(251,191,36,0.3);color:var(--yellow);}
.del-tag{background:none;border:none;color:var(--red);cursor:pointer;font-size:11px;padding:0 2px;}

input[type=text],input[type=date],select{background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-size:13px;padding:6px 10px;font-family:'Noto Sans KR',sans-serif;outline:none;}
input:focus,select:focus{border-color:var(--accent);}

.back-btn{display:flex;align-items:center;gap:6px;color:var(--text2);font-size:13px;cursor:pointer;margin-bottom:14px;}
.back-btn:hover{color:var(--accent2);}
</style>
</head>
<body>

<div class="header">
  <div class="header-title" onclick="showScreen('home');currentStaff='';" style="cursor:pointer;">💰 A+ Incentive</div>
  <div class="header-right">
    <button class="btn btn-ghost btn-sm" onclick="showScreen('manage')">⚙ Staff</button>
    <button class="btn btn-green btn-sm" id="xlsxBtn" onclick="downloadXlsx()" style="display:none;">⬇ Excel</button>
  </div>
</div>

<!-- SCREEN 1: Staff 선택 -->
<div class="screen active" id="screen-home">
  <div class="month-bar" style="margin-top:4px;">
    <span style="font-size:12px;color:var(--text3);">Month:</span>
    <select id="homeMonthYear" style="background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-size:13px;padding:5px 8px;"></select>
    <select id="homeMonthMonth" style="background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-size:13px;padding:5px 8px;margin-left:4px;"></select>
    <input type="hidden" id="homeMonth">
    <button class="month-btn active" onclick="setHomeMonth('this')">This Month</button>
    <button class="month-btn" onclick="setHomeMonth('last')">Last Month</button>
    <button class="btn btn-green btn-sm" onclick="downloadAllXlsx()">⬇ Export All</button>
  </div>
  <!-- 상단 버튼 -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px;">
    <div style="display:flex;gap:6px;">
      <button class="vt-btn active" id="homeTabMain" onclick="switchHomeTab('main')">👥 Staff</button>
      <button class="vt-btn" id="homeTabSummary" onclick="switchHomeTab('summary')">💰 Summary</button>
      <button class="vt-btn" id="homeTabAtt" onclick="switchHomeTab('att')">📋 Attendance</button>
    </div>
    <div style="display:flex;gap:6px;">
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('bookXlsxInputHome').click()">📊 Upload BOOK</button>
      <input type="file" id="bookXlsxInputHome" accept=".xlsx,.xls" style="display:none;" onchange="loadBookXlsx(this)">
    </div>
  </div>

  <!-- Staff+요약 탭 (기존 레이아웃) -->
  <div id="homeTabContentMain">
    <div id="summaryTableWrap" style="display:none;margin-bottom:16px;"></div>
    <div class="staff-grid" id="staffGrid"></div>
  </div>

  <!-- Incentive 요약 탭 -->
  <div id="homeTabContentSummary" style="display:none;">
    <div id="summaryTableWrap3"></div>
  </div>

  <!-- Present부 탭 -->
  <div id="homeTabContentAtt" style="display:none;">
    <div id="attTableWrap"></div>
  </div>
</div>

<!-- SCREEN 2: Incentive 입력 -->
<div class="screen" id="screen-entry">
  <div class="back-btn" onclick="goHome()">← Staff List</div>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
    <div>
      <div style="font-size:18px;font-weight:700;" id="entryName"></div>
      <div style="font-size:12px;color:var(--text3);" id="entryMonth"></div>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">
      <button class="btn btn-primary btn-sm" onclick="addRow()">+ Add Date</button>
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('bookXlsxInput').click()">📊 Upload BOOK</button>
      <input type="file" id="bookXlsxInput" accept=".xlsx,.xls" style="display:none;" onchange="loadBookXlsx(this)">
      <button class="btn btn-green btn-sm" onclick="downloadXlsxSingle()">⬇ Excel</button>
    </div>
  </div>

  <!-- 요약 -->
  <div class="sum-grid" id="sumGrid"></div>
  <div id="attInfoWrap" style="margin-bottom:12px;"></div>

  <!-- 테이블 -->
  <div class="inc-table-wrap">
    <table class="inc-table" id="incTable">
      <thead>
        <tr>
          <th>DATE</th>
          <th>BOOK</th>
          <th>JUICE</th>
          <th>BEER</th>
          <th>FOOD</th>
          <th>SELECT</th>
          <th title="매출장부 자동" style="color:var(--green);">SALES 📌</th>
          <th style="width:36px;"></th>
        </tr>
      </thead>
      <tbody id="incBody"></tbody>
      <tfoot>
        <tr class="total-row" id="totalRow">
          <td>Total</td>
          <td id="tot-book">-</td>
          <td id="tot-juice">-</td>
          <td id="tot-beer">-</td>
          <td id="tot-food">-</td>
          <td id="tot-select">-</td>
          <td id="tot-sales">-</td>
          <td></td>
        </tr>
      </tfoot>
    </table>
  </div>
</div>

<!-- SCREEN 3: Staff Management -->
<div class="screen" id="screen-manage">
  <div class="back-btn" onclick="showScreen('home')">← 돌아가기</div>
  <div class="sec-title">Staff Management</div>
  <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
    <input type="text" id="newStaffName" placeholder="Enter Name" style="width:120px;">
    <select id="newStaffRole">
      <option value="staff">Staff</option>
      <option value="manager">Manager</option>
    </select>
    <button class="btn btn-primary btn-sm" onclick="addStaff()">Add</button>
  </div>
  <div id="staffTagList"></div>
</div>

<!-- 빠른 입력 모달 -->
<div class="calc-modal" id="quickModal" onclick="closeQuickModal(event)">
  <div class="calc-box">
    <div style="font-size:13px;font-weight:700;color:var(--accent2);margin-bottom:4px;" id="quickModalTitle"></div>
    <div style="font-size:11px;color:var(--text3);margin-bottom:12px;" id="quickModalDate"></div>
    <div style="display:flex;flex-direction:column;gap:8px;" id="quickModalFields"></div>
    <div style="display:flex;gap:6px;margin-top:12px;">
      <button class="btn btn-primary" style="flex:1;" onclick="saveQuickInput()">✓ Save</button>
      <button class="btn btn-ghost" style="flex:1;" onclick="document.getElementById('quickModal').classList.remove('show')">Cancel</button>
    </div>
    <div style="margin-top:8px;text-align:center;">
      <button onclick="goToStaffDetail()" 
        style="background:none;border:none;color:var(--accent2);font-size:12px;cursor:pointer;text-decoration:underline;">
        → Go to Staff Detail
      </button>
    </div>
  </div>
</div>

<!-- 계산기 모달 -->
<div class="calc-modal" id="calcModal" onclick="closeCalc(event)">
  <div class="calc-box">
    <div class="calc-display">
      <div class="calc-expr" id="calcExpr"></div>
      <div class="calc-result" id="calcResult">0</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:8px;">
      <div style="display:flex;gap:6px;">
        <button class="btn btn-primary" style="flex:1;font-size:12px;" onclick="applyCalc('self')">✓ Self Only</button>
        <button class="btn btn-ghost" style="flex:1;font-size:12px;" onclick="document.getElementById('calcModal').classList.remove('show')">Cancel</button>
      </div>
      <button class="btn btn-ghost" style="width:100%;font-size:12px;color:var(--yellow);border-color:rgba(251,191,36,0.3);" onclick="applyCalc('sel')">✦ Save All Selection (Same Room)</button>
      <button class="btn btn-ghost" style="width:100%;font-size:12px;color:var(--accent2);border-color:rgba(124,111,247,0.3);" onclick="applyCalc('all')">📌 Save All Booking+Selection (Same Room)</button>
    </div>
    <div class="calc-grid">
      <button class="calc-key k-clear" onclick="calcClear()">C</button>
      <button class="calc-key k-op" onclick="calcInput('(')">(</button>
      <button class="calc-key k-op" onclick="calcInput(')')">)</button>
      <button class="calc-key k-op" onclick="calcInput('÷')">÷</button>

      <button class="calc-key k-num" onclick="calcInput('7')">7</button>
      <button class="calc-key k-num" onclick="calcInput('8')">8</button>
      <button class="calc-key k-num" onclick="calcInput('9')">9</button>
      <button class="calc-key k-op" onclick="calcInput('×')">×</button>

      <button class="calc-key k-num" onclick="calcInput('4')">4</button>
      <button class="calc-key k-num" onclick="calcInput('5')">5</button>
      <button class="calc-key k-num" onclick="calcInput('6')">6</button>
      <button class="calc-key k-op" onclick="calcInput('-')">−</button>

      <button class="calc-key k-num" onclick="calcInput('1')">1</button>
      <button class="calc-key k-num" onclick="calcInput('2')">2</button>
      <button class="calc-key k-num" onclick="calcInput('3')">3</button>
      <button class="calc-key k-op" onclick="calcInput('+')">+</button>

      <button class="calc-key k-dash" onclick="calcInput('-dash')">—</button>
      <button class="calc-key k-num" onclick="calcInput('0')">0</button>
      <button class="calc-key k-num" onclick="calcInput('.')">.</button>
      <button class="calc-key k-op" onclick="calcPercent()">%</button>
      <button class="calc-key k-num" style="grid-column:span 2;" onclick="calcDel()">⌫</button>
      <button class="calc-key k-eq" style="grid-column:span 2;" onclick="calcEval()">=</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyC0MehTEqcHuBIHEBjYGbwoirJhYP7Mo6o",
  authDomain: "aplus-sales-ledger.firebaseapp.com",
  databaseURL: "https://aplus-sales-ledger-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "aplus-sales-ledger",
  storageBucket: "aplus-sales-ledger.appspot.com",
  messagingSenderId: "868312671950",
  appId: "1:868312671950:web:abc123"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ── STATE ──────────────────────────────────────────────────
let staffList = []; // [{name, role}]
let currentStaff = '';
let currentMonthKey = '';
let incData = {}; // {rowId: {date, book, juice, beer, food, select, sales}}

// ── INIT ──────────────────────────────────────────────────
const today = new Date();
const thisMonth = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0');

// 커스텀 year/month select 초기화
(function(){
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const yearSel = document.getElementById('homeMonthYear');
  const monSel  = document.getElementById('homeMonthMonth');
  const curY = today.getFullYear(), curM = today.getMonth()+1;
  for(let y=curY-1; y<=curY+1; y++){
    const o=document.createElement('option'); o.value=y; o.text=y; yearSel.appendChild(o);
  }
  yearSel.value = curY;
  months.forEach((mn,i)=>{ const o=document.createElement('option'); o.value=String(i+1).padStart(2,'0'); o.text=mn; monSel.appendChild(o); });
  monSel.value = String(curM).padStart(2,'0');
  function syncHidden(){ document.getElementById('homeMonth').value=yearSel.value+'-'+monSel.value; renderStaffGrid(); if(summaryTableVisible) renderSummaryTable(); }
  yearSel.addEventListener('change', syncHidden);
  monSel.addEventListener('change', syncHidden);
  document.getElementById('homeMonth').value = thisMonth;
})();

// 매출장부의 Staff/Manager 목록 불러오기
onValue(ref(db,'config/staffList'), snap=>{
  const sNames = snap.exists() ? snap.val() : [];
  onValue(ref(db,'config/managerList'), snap2=>{
    const mNames = snap2.exists() ? snap2.val() : [];
    // 중복 제거하고 role 부여
    const all = [...new Set([...sNames,...mNames])].filter(Boolean).sort();
    staffList = all.map(name=>({ name, role: mNames.includes(name)?'manager':'staff' }));
    renderStaffGrid();
    renderStaffTags();
  },{onlyOnce:true});
},{onlyOnce:true});

// ── SCREEN ────────────────────────────────────────────────
window.showScreen = function(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.getElementById('xlsxBtn').style.display = name==='entry'?'':'none';
};

window.goHome = function(){
  showScreen('home');
  currentStaff = '';
};

// ── MONTH ─────────────────────────────────────────────────
window.setHomeMonth = function(type){
  const t = new Date();
  let mk;
  if(type==='this') mk = t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0');
  else { const d=new Date(t.getFullYear(),t.getMonth()-1,1); mk=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
  document.getElementById('homeMonth').value = mk;
  const [y,m] = mk.split('-');
  document.getElementById('homeMonthYear').value = y;
  document.getElementById('homeMonthMonth').value = m;
  document.querySelectorAll('.month-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  renderStaffGrid();
  if(summaryTableVisible) renderSummaryTable();
};

// ── STAFF GRID ────────────────────────────────────────────
function renderStaffGrid(){
  const grid = document.getElementById('staffGrid');
  const monthKey = document.getElementById('homeMonth').value;
  if(!monthKey){ grid.innerHTML='<div style="color:var(--text3);padding:20px;">Please select a month</div>'; return; }

  const [y,m] = monthKey.split('-').map(Number);
  // 일반 달력 기준: 1일 ~ 말일
  const fromDate = `${y}-${String(m).padStart(2,'0')}-01`;
  const lastDay = new Date(y, m, 0).getDate();
  const toDate = `${y}-${String(m).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;

  grid.innerHTML='<div style="color:var(--text3);font-size:12px;padding:10px 0;">Loading...</div>';

  onValue(ref(db,'records'), snap=>{
    if(!snap.exists()){ grid.innerHTML='<div style="color:var(--text3);padding:20px;">No data</div>'; return; }

    // 기간 내 레코드에서 부킹자/셀렉션 Staff 집계
    const staffStats = {}; // {name: {bookCnt, selCnt, totalSales}}
    snap.forEach(child=>{
      const r = child.val();
      if(!r.date || r.date < fromDate || r.date > toDate) return;

      // 부킹자
      (r.bookers||[]).filter(s=>s&&s!=='WALKIN').forEach(s=>{
        if(!staffStats[s]) staffStats[s]={bookCnt:0,selCnt:0,totalSales:0};
        staffStats[s].bookCnt++;
        staffStats[s].totalSales += (r.total||0) / ((r.bookers||[]).filter(x=>x&&x!=='WALKIN').length||1);
      });

      // 셀렉션1
      (r.staff||[]).filter(Boolean).forEach(s=>{
        if(!staffStats[s]) staffStats[s]={bookCnt:0,selCnt:0,totalSales:0};
        staffStats[s].selCnt++;
      });
      // 셀렉션2
      (r.staff2||[]).filter(Boolean).forEach(s=>{
        if(!staffStats[s]) staffStats[s]={bookCnt:0,selCnt:0,totalSales:0};
        staffStats[s].selCnt++;
      });
    });

    const activeNames = Object.keys(staffStats).sort();
    if(!activeNames.length){
      grid.innerHTML='<div style="color:var(--text3);padding:20px;font-size:12px;">선택한 에 실적이 있는 Staff가 없어요</div>';
      return;
    }

    grid.innerHTML = activeNames.map(name=>{
      const s = staffStats[name];
      const isManager = staffList.find(x=>x.name===name)?.role==='manager';
      return `<div class="staff-btn ${isManager?'manager':''}" onclick="openStaff('${name}')">
        ${isManager?'🌟':''}${name}
        <div style="font-size:10px;color:var(--text3);margin-top:4px;">
          ${s.bookCnt>0?`📌 ${s.bookCnt}`:''}
          ${s.selCnt>0?` ✦ ${s.selCnt}sel`:''}
        </div>
      </div>`;
    }).join('');

    // 전역에 저장 (디테일에서 활용)
    window._staffStats = staffStats;
    window._periodFrom = fromDate;
    window._periodTo = toDate;
  },{onlyOnce:true});
}

window.openStaff = function(name){
  currentStaff = name;
  currentMonthKey = document.getElementById('homeMonth').value;
  if(!currentMonthKey){ showToast('Please select a month'); return; }
  const [y,m] = currentMonthKey.split('-').map(Number);
  // 일반 달력 기준으로 기간 설정
  const lastDay = new Date(y, m, 0).getDate();
  window._periodFrom = `${y}-${String(m).padStart(2,'0')}-01`;
  window._periodTo   = `${y}-${String(m).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
  document.getElementById('entryName').textContent = name;
  document.getElementById('entryMonth').textContent = `${y}  ${m}`;
  showScreen('entry');
  loadFromRecords(name);
};

function loadFromRecords(name){
  const fromDate = window._periodFrom;
  const toDate = window._periodTo;
  console.log('[loadFromRecords]', name, fromDate, toDate);

  onValue(ref(db,'records'), snap=>{
    if(!snap.exists()){ loadIncData(); return; }

    // Date별 집계 + 부킹자/셀렉션 정보
    const byDate = {}; // kept for compatibility
    const dateRoomInfo = {}; // {date: [{room, bookers, sel1, sel2}]}
    let matchCount = 0;

    snap.forEach(child=>{
      const r = child.val();
      if(!r.date || r.date < fromDate || r.date > toDate) return;
      const bookers = (r.bookers||[]).filter(s=>s&&s!=='WALKIN');
      const sel1 = (r.staff||[]).filter(Boolean);
      const sel2 = (r.staff2||[]).filter(Boolean);
      const allSel = [...new Set([...sel1,...sel2])];

      const isBooker = bookers.includes(name);
      const isSel = allSel.includes(name);
      if(!isBooker && !isSel) return;
      matchCount++;

      // Date+룸별 정보 저장 (룸별 매출 포함)
      if(!dateRoomInfo[r.date]) dateRoomInfo[r.date] = [];
      const share = isBooker ? Math.round((r.total||0) / (bookers.length||1)) : 0;
      dateRoomInfo[r.date].push({
        room: r.room||'?',
        bookers: bookers,
        sel: allSel,
        sales: share  // 이 룸에서 받은 매출
      });
    });

    console.log('[loadFromRecords] matchCount:', matchCount, 'dateRoomInfo dates:', Object.keys(dateRoomInfo));
    window._dateRoomInfo = dateRoomInfo;

    onValue(ref(db,`incentive/data/${name}/${currentMonthKey}`), snap2=>{
      const saved = snap2.exists() ? snap2.val() : {};
      const newData = {...saved};

      // 레거시 행 마이그레이션 (데이터 보존하면서 새 키로 이동)
      Object.keys(newData).forEach(id=>{
        const row = newData[id];
        if(!row.date || !row.room || !row.booker) return;
        if(!dateRoomInfo[row.date]) return;
        const expectedSafeKey = (row.date+'_'+row.room+'_'+row.booker).replace(/[^a-zA-Z0-9]/g,'_');
        const expectedId = 'r_'+expectedSafeKey;
        if(id !== expectedId && !newData[expectedId]){
          // 데이터를 새 키로 복사 후 구버전 삭제
          newData[expectedId] = {...row};
          delete newData[id];
        } else if(id !== expectedId && newData[expectedId]){
          // 새 키가 이미 있으면 입력값만 병합 후 구버전 삭제
          ['book','juice','beer','food','select'].forEach(col=>{
            if(row[col] && !newData[expectedId][col]) newData[expectedId][col] = row[col];
          });
          delete newData[id];
        }
      });
      // booker/room 없는 행 중 b_ 가 아닌 것만 제거 (사용자 입력값 있으면 보존)
      Object.keys(newData).forEach(id=>{
        const row = newData[id];
        const hasUserInput = ['juice','beer','food','select','book'].some(col=>row[col]&&String(row[col]).trim()!=='');
        if(row.date && !row.booker && !id.startsWith('b_') && dateRoomInfo[row.date] && !hasUserInput){
          delete newData[id];
        }
      });

      // Date+부킹자별 행 생성 (룸별 매출 각각 적용)
      Object.entries(dateRoomInfo).forEach(([date, rooms])=>{
        rooms.forEach(({room, bookers, sel, sales})=>{
          const bookerStr = bookers.join('/');
          const safeKey = (date+'_R'+room+'_'+bookerStr).replace(/[^a-zA-Z0-9]/g,'_');
          const rowId = 'r_'+safeKey;
          const isMyBook = bookers.includes(name);

          if(!newData[rowId]){
            newData[rowId] = {
              date,
              booker: bookerStr,
              room: 'R'+room,
              ...(isMyBook && sales ? {sales} : {})
            };
          } else {
            // 기존 행 업데이트 - 사용자가 입력한 값(juice/beer/food/select/book)은 절대 덮어쓰지 않음
            newData[rowId].booker = bookerStr;
            newData[rowId].room = 'R'+room;
            // sales는 아직 사용자가 입력 안 한 경우에만 업데이트
            if(isMyBook && sales && !newData[rowId].sales) newData[rowId].sales = sales;
          }
        });
      });

      // b_ 행의 book 값을 r_ 행으로 병합
      const bKeys = Object.keys(newData).filter(id=>id.startsWith('b_'));
      const rKeys = Object.keys(newData).filter(id=>id.startsWith('r_'));
      console.log('[merge] b_ keys:', bKeys, 'r_ keys:', rKeys.slice(0,3));
      let changed = false;
      Object.keys(newData).filter(id=>id.startsWith('b_')).forEach(bid=>{
        const bRow = newData[bid];
        if(!bRow?.date || !bRow?.book) return;
        const rRows = Object.keys(newData).filter(id=>!id.startsWith('b_') && newData[id].date===bRow.date);
        if(rRows.length>0){
          rRows.forEach(rid=>{ newData[rid].book = bRow.book; });
          delete newData[bid];
          changed = true;
        }
      });

      incData = newData;
      if(changed) saveIncData();
      renderTable();
      renderStaffAttInfo(name);
    },{onlyOnce:true});
  },{onlyOnce:true});
}

function renderStaffAttInfo(name){
  const wrap = document.getElementById('attInfoWrap');
  if(!wrap) return;
  const [y,m] = currentMonthKey.split('-').map(Number);

  onValue(ref(db,'attendance'), snap=>{
    if(!snap.exists()){ wrap.innerHTML=''; return; }
    const allAtt = snap.val();
    const monthKeys = Object.keys(allAtt).filter(k=>{
      const [ky,km]=k.split('-').map(Number); return ky===y&&km===m;
    });
    if(!monthKeys.length){ wrap.innerHTML=''; return; }

    const attData = allAtt[monthKeys[0]];
    const staffEntry = (attData.staff||[]).find(s=>s.name===name);
    const entryArr = staffEntry?.entries||[];
    const dates = (attData.dates||[]).map(d=>typeof d==='object'?d.dateStr:String(d)).filter(d=>d&&d.includes('-')).sort();
    const staffInfo = (attData.staff||[]).find(s=>s.name===name);

    let present=staffInfo?.presentCnt||0, late=staffInfo?.lateCnt||0, absent=staffInfo?.absentCnt||0;
    const rows = dates.map((d,i)=>{
      const e = entryArr[i];
      if(!e){ absent++; return `<div style="display:flex;gap:8px;padding:3px 0;border-bottom:1px solid var(--border2);">
        <span style="font-size:11px;color:var(--text3);width:90px;">${d.slice(5)}</span>
        <span style="font-size:11px;color:var(--red);">Absent</span>
      </div>`; }
      const isLate = e.type==='late'||(e.time&&e.time>'08:30');
      return `<div style="display:flex;gap:8px;padding:3px 0;border-bottom:1px solid var(--border2);">
        <span style="font-size:11px;color:var(--text3);width:90px;">${d.slice(5)}</span>
        <span style="font-size:11px;color:${isLate?'var(--yellow)':'var(--green)'};">${e.time||'Present'}</span>
      </div>`;
    });

    // 가로형 Present 표
    const thS2='padding:5px 6px;background:var(--bg3);border:1px solid var(--border);font-size:10px;text-align:center;white-space:nowrap;';
    const tdS2='padding:4px 6px;border:1px solid var(--border);font-size:10px;text-align:center;font-family:"JetBrains Mono",monospace;';

    let tableHtml=`<div style="overflow-x:auto;margin-top:8px;">
      <table style="border-collapse:collapse;width:100%;">
        <thead><tr>
          <th style="${thS2}text-align:left;">Date</th>`;
    dates.forEach(d=>{
      const day=parseInt(d.split('-')[2]);
      const dow=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(d+'T00:00:00').getDay()];
      const isFriSat=[5,6].includes(new Date(d+'T00:00:00').getDay());
      tableHtml+=`<th style="${thS2}${isFriSat?'color:var(--red);':''}">${day}<br><span style="font-size:8px;">${dow}</span></th>`;
    });
    tableHtml+=`</tr></thead><tbody><tr>
      <td style="${tdS2}text-align:left;font-weight:600;background:var(--bg2);">Time</td>`;
    dates.forEach((d,i)=>{
      const e = entryArr[i];
      if(!e){ tableHtml+=`<td style="${tdS2}color:var(--text3);">-</td>`; return; }
      const isLate = e.type==='late'||(e.time&&e.time>'08:30');
      tableHtml+=`<td style="${tdS2}color:${isLate?'var(--yellow)':'var(--green)'};">${e.time||'✓'}</td>`;
    });
    tableHtml+=`</tr></tbody></table></div>`;

    wrap.innerHTML=`<div style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:4px;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap;">
        <span style="font-size:12px;font-weight:700;color:var(--text2);">📋 Attendance</span>
        <span style="font-size:12px;color:var(--green);">Present ${present}d</span>
        <span style="font-size:12px;color:var(--yellow);">Late ${late}d</span>
        <span style="font-size:12px;color:var(--red);">Absent ${absent}d</span>
      </div>
      ${tableHtml}
    </div>`;
  },{onlyOnce:true});
}

function loadIncData(){
  const path = `incentive/data/${currentStaff}/${currentMonthKey}`;
  onValue(ref(db,path), snap=>{
    incData = snap.exists() ? snap.val() : {};
    renderTable();
  },{onlyOnce:true});
}

function saveIncData(){
  const path = `incentive/data/${currentStaff}/${currentMonthKey}`;
  set(ref(db,path), incData);
}

// ── TABLE RENDER ──────────────────────────────────────────
const COLS = ['book','juice','beer','food','select','sales'];

function renderTable(){
  const tbody = document.getElementById('incBody');
  const rows = Object.entries(incData).sort((a,b)=>a[1].date?.localeCompare(b[1].date||'')||0);

  // 현재 Staff가 Manager인지 확인
  const isCurrentManager = staffList.find(s=>s.name===currentStaff)?.role==='manager';

  // Date별로 그룹화해서 렌더
  const grouped = {};
  rows.forEach(([id,row])=>{
    const d = row.date||'_';
    if(!grouped[d]) grouped[d]=[];
    grouped[d].push([id,row]);
  });

  tbody.innerHTML = Object.entries(grouped).sort((a,b)=>a[0].localeCompare(b[0])).map(([date, dateRows])=>{
    // 룸별 셀렉션 명단 맵 {bookerStr: [selNames]}
    const roomSelMap = {};
    (window._dateRoomInfo||{})[date]?.forEach(r=>{
      const bKey = r.bookers.join('/');
      roomSelMap[bKey] = r.sel.filter(s=>s!==currentStaff);
    });

    const makeStaffBtn=(name)=>`<button onclick="window.quickInputModal('${name}','${date}')"
      style="background:var(--bg4);border:1px solid var(--border);border-radius:12px;padding:2px 8px;font-size:10px;color:var(--text2);cursor:pointer;margin:1px;">${name}</button>`;

    return dateRows.map(([id,row],rowIdx)=>{
      const selNames = roomSelMap[row.booker||'']||[];
      // 부킹자 버튼 (각 부킹자 클릭 → 디테일 이동)
      const bookerNames = (row.booker||'').split('/').filter(Boolean);
      const bookerBtns = bookerNames.map(b=>
        `<button onclick="window.quickInputModal('${b}','${date}')"
          style="background:rgba(124,111,247,0.12);border:1px solid rgba(124,111,247,0.3);border-radius:12px;padding:2px 8px;font-size:10px;color:var(--accent2);cursor:pointer;margin:1px;">${b}</button>`
      ).join('');
      const bookerLabel = row.booker ? `<div style="font-size:10px;color:var(--accent2);font-weight:600;margin-bottom:2px;">📌 ${row.room||''} ${bookerBtns}</div>` : '';
      const selLabel = selNames.length ? `<div style="display:flex;flex-wrap:wrap;gap:2px;">${selNames.map(makeStaffBtn).join('')}</div>` : '';

      return `<tr id="row-${id}">
        <td style="vertical-align:top;padding:6px 8px;">
          ${rowIdx===0?`<div style="font-size:12px;font-weight:700;margin-bottom:4px;">${date}</div>`:''}
          ${bookerLabel}
          ${selLabel}
        </td>
        ${COLS.map(col=>{
          const isAuto = col==='sales';
          const isLocked = isCurrentManager && col!=='book' && col!=='sales';
          return `<td>
            <input class="cell-input" type="text" 
              value="${row[col]?Math.round(parseFloat(String(row[col]).replace(/[^0-9.\-]/g,''))||0)||row[col]:''}"
              data-raw="${row[col]||''}"
              onchange="updateCell('${id}','${col}',this.value)"
              onfocus="this.value=this.dataset.raw||'';this.select()"
              inputmode="decimal"
              ${isAuto?'readonly style="color:var(--green);cursor:default;"':''}
              ${isLocked?'readonly style="color:var(--text3);cursor:not-allowed;background:rgba(0,0,0,0.2);"':''}>
            ${!isAuto&&!isLocked?`<button class="calc-trigger" onclick="openCalc('${id}','${col}',this.previousElementSibling)">⌗</button>`:''}
          </td>`;
        }).join('')}
        <td><button onclick="deleteRow('${id}')" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:14px;padding:6px;">✕</button></td>
      </tr>`;
    }).join('');
  }).join('');

  renderTotals();
  renderSummary();
}

function renderTotals(){
  COLS.forEach(col=>{
    const tot = Object.values(incData).reduce((s,r)=>{
      const v = parseFloat(String(r[col]||'').replace(/[^0-9.\-]/g,''))||0;
      return s+v;
    },0);
    const el = document.getElementById('tot-'+col);
    if(el) el.textContent = tot>0 ? Math.round(tot).toLocaleString() : '-';
  });
}

function renderSummary(){
  const grid = document.getElementById('sumGrid');
  const labels = {book:'BOOK',juice:'JUICE',beer:'BEER',food:'FOOD',select:'SELECT'};
  const colors = {book:'var(--accent2)',juice:'var(--blue)',beer:'var(--yellow)',food:'var(--green)',select:'var(--orange)'};
  const incCols = ['book','juice','beer','food','select'];

  // 항목별 Total
  const tots = {};
  COLS.forEach(col=>{
    tots[col] = Object.values(incData).reduce((s,r)=>{
      return s+(parseFloat(String(r[col]||'').replace(/[^0-9.\-]/g,''))||0);
    },0);
  });
  const incTotal = incCols.reduce((s,col)=>s+tots[col],0);

  grid.innerHTML = incCols.map(col=>`
    <div class="sum-card">
      <div class="sum-label">${labels[col]}</div>
      <div class="sum-value" style="color:${colors[col]};font-size:14px;">${tots[col]>0?Math.round(tots[col]).toLocaleString():'-'}</div>
    </div>`).join('')+`
    <div class="sum-card" style="border-color:var(--accent);background:rgba(124,111,247,0.08);">
      <div class="sum-label" style="color:var(--accent2);">💰 Incentive Total</div>
      <div class="sum-value" style="color:var(--accent2);font-size:16px;">${incTotal>0?Math.round(incTotal).toLocaleString():'-'}</div>
      <div style="font-size:10px;color:var(--text3);margin-top:4px;">SALES: ${tots['sales']>0?Math.round(tots['sales']).toLocaleString():'-'}</div>
    </div>`;
}

window.addRow = function(){
  const [y,m] = currentMonthKey.split('-').map(Number);
  const dateStr = prompt('Date 입력 (예: 1, 15, 30)',String(new Date().getDate()));
  if(!dateStr) return;
  const day = parseInt(dateStr);
  if(isNaN(day)||day<1||day>31){ showToast('Please enter a valid date'); return; }
  const fullDate = `${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  const id = Date.now().toString();
  incData[id] = {date: fullDate};
  saveIncData();
  renderTable();
};

window.updateCell = function(id, col, val){
  if(!incData[id]){
    // Firebase에서 다시 읽어서 저장
    onValue(ref(db,`incentive/data/${currentStaff}/${currentMonthKey}`), snap=>{
      incData = snap.exists() ? snap.val() : {};
      if(!incData[id]) incData[id] = {};
      incData[id][col] = val;
      saveIncData();
      renderTotals();
      renderSummary();
    },{onlyOnce:true});
    return;
  }
  incData[id][col] = val;
  saveIncData();
  renderTotals();
  renderSummary();
};

window.deleteRow = function(id){
  if(!confirm('Delete this row?')) return;
  delete incData[id];
  saveIncData();
  renderTable();
};

// ── CALCULATOR ────────────────────────────────────────────
let calcExpr = '';
let calcTargetInput = null;
let calcTargetId = '';
let calcTargetCol = '';

window.openCalc = function(id, col, input){
  calcTargetInput = input;
  calcTargetId = id;
  calcTargetCol = col;
  calcExpr = input.value || '';
  document.getElementById('calcExpr').textContent = calcExpr;
  document.getElementById('calcResult').textContent = calcExpr || '0';
  document.getElementById('calcModal').classList.add('show');
};

window.closeCalc = function(e){
  if(e.target===document.getElementById('calcModal'))
    document.getElementById('calcModal').classList.remove('show');
};

window.calcInput = function(v){
  if(v==='-dash'){ calcExpr='-'; }
  else { calcExpr += v; }
  document.getElementById('calcExpr').textContent = calcExpr;
  try{
    const expr = calcExpr.replace(/×/g,'*').replace(/÷/g,'/');
    const result = eval(expr);
    if(!isNaN(result)) document.getElementById('calcResult').textContent = result.toLocaleString();
  }catch(e){}
};

window.calcPercent = function(){
  try{
    const expr = calcExpr.replace(/×/g,'*').replace(/÷/g,'/');
    const result = eval(expr);
    if(!isNaN(result)){
      calcExpr = String(result/100);
      document.getElementById('calcResult').textContent = (result/100).toLocaleString();
      document.getElementById('calcExpr').textContent = '';
    }
  }catch(e){}
};

window.calcDel = function(){
  calcExpr = calcExpr.slice(0,-1);
  document.getElementById('calcExpr').textContent = calcExpr;
  document.getElementById('calcResult').textContent = calcExpr||'0';
};

window.calcClear = function(){
  calcExpr='';
  document.getElementById('calcExpr').textContent='';
  document.getElementById('calcResult').textContent='0';
};

window.calcEval = function(){
  try{
    const expr = calcExpr.replace(/×/g,'*').replace(/÷/g,'/');
    const result = eval(expr);
    if(!isNaN(result)){
      calcExpr = String(result);
      document.getElementById('calcResult').textContent = result.toLocaleString();
      document.getElementById('calcExpr').textContent = '';
    }
  }catch(e){}
};

window.applyCalc = function(mode='self'){
  try{
    const expr = calcExpr.replace(/×/g,'*').replace(/÷/g,'/');
    const val = calcExpr==='-' ? '-' : String(eval(expr));

    // 본인 입력 (Manager는 book만)
    if(calcTargetInput){
      const isCurrentMgr = staffList.find(s=>s.name===currentStaff)?.role==='manager';
      if(isCurrentMgr && calcTargetCol!=='book' && calcTargetCol!=='sales'){
        showToast('⚠ Manager는 BOOK만 입력 가능해요');
        document.getElementById('calcModal').classList.remove('show');
        return;
      }
      calcTargetInput.value = val;
      updateCell(calcTargetId, calcTargetCol, val);
    }

    // 같은 룸 Staffto도 적용
    if(mode==='sel'||mode==='all'){
      const date = (incData[calcTargetId]||{}).date;
      const bookerStr = (incData[calcTargetId]||{}).booker||'';
      const roomInfo = (window._dateRoomInfo||{})[date]||[];
      const myRoom = roomInfo.find(r=>r.bookers.join('/')=== bookerStr);

      if(myRoom){
        // 셀렉션 Staff
        const targets = [...(myRoom.sel||[])];
        // all이면 부킹자도 포함
        if(mode==='all') myRoom.bookers.forEach(b=>{ if(!targets.includes(b)) targets.push(b); });
        // Manager는 제외 (JUICE/BEER/FOOD/SELECT 적용 불가)
        const filteredTargets = targets.filter(t=>{
          const role = staffList.find(s=>s.name===t)?.role;
          return role!=='manager';
        });
        targets.splice(0, targets.length, ...filteredTargets);

        let saved=0;
        const toSave = targets.filter(s=>s&&s!==currentStaff);
        if(!toSave.length){ showToast('적용할 Staff 없음'); document.getElementById('calcModal').classList.remove('show'); return; }

        toSave.forEach(staffName=>{
          onValue(ref(db,`incentive/data/${staffName}/${currentMonthKey}`), snap=>{
            const saved2 = snap.exists() ? snap.val() : {};
            const newData = {...saved2};
            // 해당 Date+같은룸 행 찾기
            const myRoomNum = (incData[calcTargetId]||{}).room||'';
            const safeKey = (date+'_'+myRoomNum+'_'+bookerStr).replace(/[^a-zA-Z0-9]/g,'_');
            const rowId = 'r_'+safeKey;
            if(!newData[rowId]) newData[rowId] = {date, booker:bookerStr};
            newData[rowId][calcTargetCol] = val;
            set(ref(db,`incentive/data/${staffName}/${currentMonthKey}`), newData);
            saved++;
            if(saved===toSave.length){
              showToast(`✓ ${toSave.length} staff → ${calcTargetCol.toUpperCase()} ${val} Saved`);
            }
          },{onlyOnce:true});
        });
      } else {
        showToast('No room info available');
      }
    }

    document.getElementById('calcModal').classList.remove('show');
  }catch(e){ showToast('Calculation error'); }
};

window.loadBookXlsx = function(input){
  const file = input.files[0]; if(!file) return;
  const monthKey = currentMonthKey || document.getElementById('homeMonth').value;
  if(!monthKey){ 
    showToast('⚠ 먼저 Please select a month!'); 
    input.value=''; 
    return; 
  }
  showToast(`${monthKey} Uploading data...`);
  const [y,m] = monthKey.split('-').map(Number);

  loadXLSX(()=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const wb = window.XLSX.read(e.target.result, {type:'array', cellDates:false});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const raw = window.XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
      if(!raw.length){ showToast('No data'); input.value=''; return; }

      // 헤더행에서 Staff Name 추출
      const headerRow = raw[0];
      const staffCols = {};
      headerRow.forEach((cell,ci)=>{
        if(ci===0) return;
        const name = String(cell||'').trim().toUpperCase();
        if(name && name!=='TOTAL' && name!=='Total') staffCols[ci] = name;
      });

      if(!Object.keys(staffCols).length){ showToast('Staff 헤더를 찾을 수 없음'); input.value=''; return; }

      // Date 파싱 함수
      function parseDate(v){
        const s = String(v||'').trim();
        if(!s) return '';
        const mDash = s.match(/^(\d+)[-\/](\d+)/);
        if(mDash) return y+'-'+String(parseInt(mDash[1])).padStart(2,'0')+'-'+String(parseInt(mDash[2])).padStart(2,'0');
        if(typeof v==='number' && v>40000){
          const d=new Date(Math.round((v-25569)*86400000));
          return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
        }
        if(s.match(/\d{4}-\d{2}-\d{2}/)) return s.slice(0,10);
        return '';
      }

      // Staff별 데이터 수집
      const staffData = {};
      raw.slice(1).forEach(row=>{
        if(!row[0]) return;
        const v = String(row[0]).trim().toUpperCase();
        if(v.includes('TOTAL')||v.includes('Total')) return;
        const dateStr = parseDate(row[0]);
        if(!dateStr) return;
        Object.entries(staffCols).forEach(([ci,staffName])=>{
          const val = row[ci];
          if(val===''||val===null||val===undefined||String(val).trim()==='-') return;
          const amt = parseFloat(String(val).replace(/[^0-9.-]/g,''))||0;
          if(!amt) return;
          if(!staffData[staffName]) staffData[staffName]={};
          staffData[staffName][dateStr] = amt;
        });
      });

      const staffNames = Object.keys(staffData);
      if(!staffNames.length){ showToast('유효한 No data'); input.value=''; return; }

      showToast(`Saving ${staffNames.length} staff...`);
      let savedCount=0;
      staffNames.forEach(staffName=>{
        onValue(ref(db,`incentive/data/${staffName}/${monthKey}`), snap=>{
          const existing = snap.exists() ? snap.val() : {};
          const newData = {...existing};
          Object.entries(staffData[staffName]).forEach(([dateStr, amt])=>{
            // 해당 Date의 모든 행에 book 적용 (여러 룸 있을 수 있음)
            const dateRows = Object.keys(newData).filter(id=>newData[id].date===dateStr);
            if(dateRows.length>=1){
              // 모든 Date 행에 book 저장 (룸별로 나뉜 경우)
              dateRows.forEach(id=>{ newData[id].book = amt; });
              // b_ 로 시작하는 중복 행 제거
              dateRows.filter(id=>id.startsWith('b_')).forEach(id=>{
                if(dateRows.length>1) delete newData[id];
              });
            } else {
              newData['b_'+dateStr.replace(/-/g,'')] = {date:dateStr, book:amt};
            }
          });
          // 고아 b_ 행 정리 (r_ 행과 Date 중복되는 b_ 행 삭제)
          Object.keys(newData).filter(id=>id.startsWith('b_')).forEach(bid=>{
            const bDate = newData[bid]?.date;
            const hasRRow = Object.keys(newData).some(id=>!id.startsWith('b_')&&newData[id].date===bDate);
            if(hasRRow) delete newData[bid];
          });
          set(ref(db,`incentive/data/${staffName}/${monthKey}`), newData);
          savedCount++;
          if(savedCount===staffNames.length){
            showToast('✓ '+staffNames.length+' staff BOOK incentive uploaded!');
            if(currentStaff && staffData[currentStaff]) loadFromRecords(currentStaff);
          }
        },{onlyOnce:true});
      });
      input.value='';
    };
    reader.readAsArrayBuffer(file);
  });
};

function renderAttTable(){
  const monthKey = document.getElementById('homeMonth').value;
  if(!monthKey) return;
  const [y,m] = monthKey.split('-').map(Number);
  const wrap = document.getElementById('attTableWrap');
  wrap.innerHTML='<div style="color:var(--text3);font-size:12px;padding:10px;">Loading...</div>';

  // 매출장부 attendance 데이터 로드
  onValue(ref(db,'attendance'), snap=>{
    if(!snap.exists()){ wrap.innerHTML='<div style="color:var(--text3);padding:20px;">Present No data</div>'; return; }

    // 해당  데이터 찾기 (영업 기준 또는 일반 기준 모두 확인)
    const allAtt = snap.val();
    // 해당  키 찾기
    const monthKeys = Object.keys(allAtt).filter(k=>{
      const [ky,km] = k.split('-').map(Number);
      return ky===y && km===m;
    });

    if(!monthKeys.length){ wrap.innerHTML='<div style="color:var(--text3);padding:20px;">해당  Present No data</div>'; return; }

    const attData = allAtt[monthKeys[0]];
    // dates는 [{dateStr, dow}] 형식
    const dates = (attData.dates||[]).map(d=>typeof d==='object'?d.dateStr:String(d)).filter(d=>d&&d.includes('-')).sort();
    const staffArr = attData.staff||[];
    const dailyHC = attData.dailyHeadCount||{};

    if(!dates.length){ wrap.innerHTML='<div style="color:var(--text3);padding:20px;">Date No data</div>'; return; }

    // Staff별 Date→Time 맵 생성
    const staffTimeMap = {}; // {name: {dateStr: {time, type}}}
    staffArr.forEach(s=>{
      staffTimeMap[s.name] = {};
      (s.entries||[]).forEach((e,i)=>{
        if(dates[i]) staffTimeMap[s.name][dates[i]] = {time:e.time||'', type:e.type||''};
      });
    });

    const thS='padding:6px 8px;background:var(--bg3);border:1px solid var(--border);font-size:10px;text-align:center;white-space:nowrap;position:sticky;top:0;z-index:2;';
    const tdS='padding:4px 8px;border:1px solid var(--border);font-size:11px;text-align:center;font-family:"JetBrains Mono",monospace;';

    let html=`<div style="overflow-x:auto;overflow-y:auto;max-height:65vh;">
      <table style="border-collapse:collapse;min-width:600px;">
        <thead><tr>
          <th style="${thS}text-align:left;position:sticky;left:0;z-index:3;min-width:80px;">Name</th>
          <th style="${thS}color:var(--green);">Present</th>
          <th style="${thS}color:var(--yellow);">Late</th>
          <th style="${thS}color:var(--red);">Absent</th>`;

    dates.forEach(d=>{
      const day=parseInt(d.split('-')[2]);
      const dow=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(d+'T00:00:00').getDay()];
      const isFriSat=[5,6].includes(new Date(d+'T00:00:00').getDay());
      const hc=dailyHC[d]||'';
      html+=`<th style="${thS}${isFriSat?'color:var(--red);':''}">${day}<br><span style="font-size:9px;">${dow}</span>${hc?`<br><span style="color:var(--green);font-size:9px;">${hc}</span>`:''}`;
      html+=`</th>`;
    });
    html+=`</tr></thead><tbody>`;

    // Staff별 행 - 출근기록 있는 사람 위, 없는 사람 아래
    [...staffArr].sort((a,b)=>{
      const aHasRecord = (a.presentCnt||0)+(a.lateCnt||0) > 0 || Object.values(staffTimeMap[a.name]||{}).some(e=>e.time&&e.time.trim()!=='');
      const bHasRecord = (b.presentCnt||0)+(b.lateCnt||0) > 0 || Object.values(staffTimeMap[b.name]||{}).some(e=>e.time&&e.time.trim()!=='');
      if(aHasRecord && !bHasRecord) return -1;
      if(!aHasRecord && bHasRecord) return 1;
      return a.name.localeCompare(b.name);
    }).forEach(s=>{
      let present=0, late=0, absent=0;
      const cells = dates.map(d=>{
        const e = staffTimeMap[s.name]?.[d];
        if(!e){ absent++; return `<td style="${tdS}color:var(--text3);">-</td>`; }
        const isLate = e.type==='late'||( e.time && e.time>'08:30');
        if(isLate) late++; else present++;
        return `<td style="${tdS}color:${isLate?'var(--yellow)':'var(--green)'};">${e.time||'✓'}</td>`;
      });
      html+=`<tr>
        <td style="${tdS}text-align:left;position:sticky;left:0;z-index:1;background:var(--bg2);font-weight:600;min-width:70px;">${s.name}</td>
        <td style="${tdS}color:var(--green);font-weight:700;">${s.presentCnt||present}</td>
        <td style="${tdS}color:var(--yellow);font-weight:700;">${s.lateCnt||late||'-'}</td>
        <td style="${tdS}color:var(--red);font-weight:700;">${s.absentCnt||absent||'-'}</td>
        ${cells.join('')}
      </tr>`;
    });
    html+=`</tbody></table></div>`;
    wrap.innerHTML=html;
  },{onlyOnce:true});
}

// ── Incentive 요약 탭 ────────────────────────────────────────


window.downloadAllXlsx = function(){
  const monthKey = document.getElementById('homeMonth').value;
  if(!monthKey){ showToast('Please select a month'); return; }
  const [y,m] = monthKey.split('-').map(Number);

  loadXLSX(()=>{
    showToast('Loading data...');
    onValue(ref(db,'incentive/data'), snap=>{
      const allData = snap.exists() ? snap.val() : {};
      const INC_COLS = ['book','juice','beer','food','select'];
      const labels = {book:'BOOK',juice:'JUICE',beer:'BEER',food:'FOOD',select:'SELECT'};

      // 알파벳순 정렬
      const names = Object.keys(allData).filter(name=>{
        const md = allData[name]?.[monthKey];
        return md && Object.keys(md).length>0;
      }).sort();

      if(!names.length){ showToast('⚠ 해당  No data'); return; }

      // 헤더
      const headerRow = ['Name','BOOK','JUICE','BEER','FOOD','SELECT','💰 Incentive Total','SALES'];
      const rows = [
        [`${y}  ${m} Staff Incentive Summary`],
        [],
        headerRow
      ];

      names.forEach(name=>{
        const md = allData[name]?.[monthKey]||{};
        const tots = {};
        INC_COLS.forEach(col=>{
          tots[col] = Object.values(md).reduce((s,r)=>
            s+(parseFloat(String(r[col]||'').replace(/[^0-9.-]/g,''))||0),0);
        });
        const incTotal = INC_COLS.reduce((s,col)=>s+tots[col],0);
        const salesTot = Object.values(md).reduce((s,r)=>
          s+(parseFloat(String(r['sales']||'').replace(/[^0-9.-]/g,''))||0),0);

        rows.push([
          name,
          tots['book']||'',
          tots['juice']||'',
          tots['beer']||'',
          tots['food']||'',
          tots['select']||'',
          incTotal||'',
          salesTot||''
        ]);
      });

      // Total행
      const totRow = ['Total'];
      [...INC_COLS,'incTotal','sales'].forEach((col,i)=>{
        if(col==='incTotal'){
          const t = names.reduce((s,name)=>{
            const md=allData[name]?.[monthKey]||{};
            return s+INC_COLS.reduce((ss,c)=>ss+(parseFloat(String(Object.values(md).reduce((sv,r)=>sv+(parseFloat(String(r[c]||'').replace(/[^0-9.-]/g,''))||0),0))||0)),0);
          },0);
          totRow.push(t||'');
        } else {
          const t = names.reduce((s,name)=>{
            const md=allData[name]?.[monthKey]||{};
            return s+Object.values(md).reduce((ss,r)=>ss+(parseFloat(String(r[col]||'').replace(/[^0-9.-]/g,''))||0),0);
          },0);
          totRow.push(t||'');
        }
      });
      rows.push([]);
      rows.push(totRow);

      const wb = window.XLSX.utils.book_new();
      const ws = window.XLSX.utils.aoa_to_sheet(rows);
      ws['!cols']=[{wch:14},{wch:10},{wch:10},{wch:10},{wch:10},{wch:10},{wch:14},{wch:12}];
      window.XLSX.utils.book_append_sheet(wb, ws, `${y}-${String(m).padStart(2,'0')}`);
      window.XLSX.writeFile(wb, `AllIncentive_${monthKey}.xlsx`);
      showToast('✓ Export All 다운로드 완료!');
    },{onlyOnce:true});
  });
};

window.showToast = function(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
};
