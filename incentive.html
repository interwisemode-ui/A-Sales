<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>A+ Incentive</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0f;--bg2:#111118;--bg3:#18181f;--bg4:#20202a;
  --border:#2a2a38;--border2:#38384a;
  --accent:#7c6ff7;--accent2:#a99ef8;
  --green:#34d399;--red:#f87171;--yellow:#fbbf24;--blue:#60a5fa;--orange:#fb923c;
  --text:#e8e8f0;--text2:#9898b0;--text3:#606078;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;}

/* HEADER */
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.header-title{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:var(--accent2);}
.header-right{display:flex;align-items:center;gap:8px;}

/* BTN */
.btn{padding:7px 14px;border-radius:6px;border:none;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:#6b5ee0;}
.btn-ghost{background:var(--bg3);color:var(--text2);border:1px solid var(--border2);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-green{background:rgba(52,211,153,0.15);color:var(--green);border:1px solid rgba(52,211,153,0.3);}

/* SCREEN */
.screen{display:none;padding:16px;}
.screen.active{display:block;}

/* STAFF GRID */
.staff-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:12px;}
.staff-btn{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px 8px;text-align:center;cursor:pointer;transition:all .15s;font-size:13px;font-weight:600;}
.staff-btn:hover,.staff-btn:active{border-color:var(--accent);background:rgba(124,111,247,0.1);color:var(--accent2);}
.staff-btn.manager{border-color:rgba(251,191,36,0.3);color:var(--yellow);}

/* SECTION TITLE */
.sec-title{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:10px;}

/* MONTH BAR */
.month-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.month-btn{padding:5px 12px;border-radius:20px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);font-size:12px;cursor:pointer;}
.month-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}

/* TABLE */
.inc-table-wrap{overflow-x:auto;margin-bottom:12px;}
.inc-table{border-collapse:collapse;width:100%;min-width:600px;font-size:12px;}
.inc-table th{background:var(--bg3);border:1px solid var(--border);padding:7px 8px;text-align:center;color:var(--text3);font-weight:700;white-space:nowrap;position:sticky;top:0;}
.inc-table th:first-child{position:sticky;left:0;z-index:2;background:var(--bg3);}
.inc-table td{border:1px solid var(--border);padding:0;text-align:center;position:relative;}
.inc-table td:first-child{background:var(--bg2);font-weight:600;padding:6px 8px;white-space:nowrap;position:sticky;left:0;z-index:1;}
.inc-table tr:hover td{background:rgba(124,111,247,0.04);}
.inc-table tr:hover td:first-child{background:var(--bg2);}
.cell-input{width:100%;height:36px;background:transparent;border:none;color:var(--text);font-size:12px;text-align:center;font-family:'JetBrains Mono',monospace;padding:0 4px;outline:none;}
.cell-input:focus{background:rgba(124,111,247,0.1);}
.total-row td{background:var(--bg3)!important;font-weight:700;color:var(--accent2);font-family:'JetBrains Mono',monospace;}
.total-row td:first-child{color:var(--text2);}

/* CALC BTN in cell */
.calc-trigger{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:16px;height:16px;border-radius:3px;background:rgba(124,111,247,0.2);border:none;color:var(--accent2);font-size:9px;cursor:pointer;display:none;align-items:center;justify-content:center;padding:0;}
td:hover .calc-trigger{display:flex;}

/* SUMMARY CARDS */
.sum-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:14px;}
.sum-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
.sum-label{font-size:10px;color:var(--text3);margin-bottom:4px;}
.sum-value{font-size:16px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--accent2);}

/* CALCULATOR MODAL */
.calc-modal{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:none;align-items:flex-end;justify-content:center;}
.calc-modal.show{display:flex;}
.calc-box{background:var(--bg2);border-radius:16px 16px 0 0;border:1px solid var(--border);width:100%;max-width:360px;padding:16px;}
.calc-display{background:var(--bg3);border-radius:8px;padding:10px 14px;margin-bottom:12px;text-align:right;}
.calc-expr{font-size:11px;color:var(--text3);min-height:16px;}
.calc-result{font-size:24px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--text);}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.calc-key{height:52px;border-radius:8px;border:none;font-size:16px;font-weight:600;cursor:pointer;font-family:'JetBrains Mono',monospace;transition:all .1s;}
.calc-key:active{transform:scale(0.95);}
.k-num{background:var(--bg3);color:var(--text);}
.k-op{background:rgba(124,111,247,0.2);color:var(--accent2);}
.k-eq{background:var(--accent);color:#fff;}
.k-clear{background:rgba(248,113,113,0.2);color:var(--red);}
.k-ok{background:var(--green);color:#000;font-size:13px;}
.k-dash{background:var(--bg3);color:var(--text3);}

/* ADD ROW */
.add-row-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
.date-input{background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-size:13px;padding:6px 10px;font-family:'Noto Sans KR',sans-serif;}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 16px;font-size:12px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.show{opacity:1;}

/* STAFF MGMT */
.staff-mgmt{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.staff-tag{display:inline-flex;align-items:center;gap:4px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:12px;}
.staff-tag.mgr{border-color:rgba(251,191,36,0.3);color:var(--yellow);}
.del-tag{background:none;border:none;color:var(--red);cursor:pointer;font-size:11px;padding:0 2px;}

input[type=text],input[type=date],select{background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-size:13px;padding:6px 10px;font-family:'Noto Sans KR',sans-serif;outline:none;}
input:focus,select:focus{border-color:var(--accent);}

.back-btn{display:flex;align-items:center;gap:6px;color:var(--text2);font-size:13px;cursor:pointer;margin-bottom:14px;}
.back-btn:hover{color:var(--accent2);}
</style>
</head>
<body>

<div class="header">
  <div class="header-title">💰 A+ Incentive</div>
  <div class="header-right">
    <button class="btn btn-ghost btn-sm" onclick="showScreen('manage')">⚙ 스태프</button>
    <button class="btn btn-green btn-sm" id="xlsxBtn" onclick="downloadXlsx()" style="display:none;">⬇ 엑셀</button>
  </div>
</div>

<!-- SCREEN 1: 스태프 선택 -->
<div class="screen active" id="screen-home">
  <div class="month-bar" style="margin-top:4px;">
    <span style="font-size:12px;color:var(--text3);">월 선택:</span>
    <input type="month" id="homeMonth" style="background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-size:13px;padding:5px 10px;">
    <button class="month-btn active" onclick="setHomeMonth('this')">이번달</button>
    <button class="month-btn" onclick="setHomeMonth('last')">지난달</button>
    <button class="btn btn-green btn-sm" onclick="downloadAllXlsx()">⬇ 전체 엑셀</button>
  </div>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
    <div class="sec-title" style="margin-bottom:0;">스태프 선택</div>
    <button class="btn btn-ghost btn-sm" onclick="toggleSummaryTable()">📊 전체 요약</button>
  </div>
  <div id="summaryTableWrap" style="display:none;margin-bottom:16px;"></div>
  <div class="staff-grid" id="staffGrid"></div>
</div>

<!-- SCREEN 2: 인센티브 입력 -->
<div class="screen" id="screen-entry">
  <div class="back-btn" onclick="goHome()">← 스태프 목록</div>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
    <div>
      <div style="font-size:18px;font-weight:700;" id="entryName"></div>
      <div style="font-size:12px;color:var(--text3);" id="entryMonth"></div>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">
      <button class="btn btn-primary btn-sm" onclick="addRow()">+ 날짜 추가</button>
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('bookXlsxInput').click()">📊 BOOK 업로드</button>
      <input type="file" id="bookXlsxInput" accept=".xlsx,.xls" style="display:none;" onchange="loadBookXlsx(this)">
      <button class="btn btn-green btn-sm" onclick="downloadXlsxSingle()">⬇ 엑셀</button>
    </div>
  </div>

  <!-- 요약 -->
  <div class="sum-grid" id="sumGrid"></div>

  <!-- 테이블 -->
  <div class="inc-table-wrap">
    <table class="inc-table" id="incTable">
      <thead>
        <tr>
          <th>DATE</th>
          <th>BOOK</th>
          <th>JUICE</th>
          <th>BEER</th>
          <th>FOOD</th>
          <th>SELECT</th>
          <th title="매출장부 자동" style="color:var(--green);">SALES 📌</th>
          <th style="width:36px;"></th>
        </tr>
      </thead>
      <tbody id="incBody"></tbody>
      <tfoot>
        <tr class="total-row" id="totalRow">
          <td>합계</td>
          <td id="tot-book">-</td>
          <td id="tot-juice">-</td>
          <td id="tot-beer">-</td>
          <td id="tot-food">-</td>
          <td id="tot-select">-</td>
          <td id="tot-sales">-</td>
          <td></td>
        </tr>
      </tfoot>
    </table>
  </div>
</div>

<!-- SCREEN 3: 스태프 관리 -->
<div class="screen" id="screen-manage">
  <div class="back-btn" onclick="showScreen('home')">← 돌아가기</div>
  <div class="sec-title">스태프 관리</div>
  <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
    <input type="text" id="newStaffName" placeholder="이름 입력" style="width:120px;">
    <select id="newStaffRole">
      <option value="staff">스태프</option>
      <option value="manager">매니저</option>
    </select>
    <button class="btn btn-primary btn-sm" onclick="addStaff()">추가</button>
  </div>
  <div id="staffTagList"></div>
</div>

<!-- 빠른 입력 모달 -->
<div class="calc-modal" id="quickModal" onclick="closeQuickModal(event)">
  <div class="calc-box">
    <div style="font-size:13px;font-weight:700;color:var(--accent2);margin-bottom:4px;" id="quickModalTitle"></div>
    <div style="font-size:11px;color:var(--text3);margin-bottom:12px;" id="quickModalDate"></div>
    <div style="display:flex;flex-direction:column;gap:8px;" id="quickModalFields"></div>
    <div style="display:flex;gap:6px;margin-top:12px;">
      <button class="btn btn-primary" style="flex:1;" onclick="saveQuickInput()">✓ 저장</button>
      <button class="btn btn-ghost" style="flex:1;" onclick="document.getElementById('quickModal').classList.remove('show')">취소</button>
    </div>
    <div style="margin-top:8px;text-align:center;">
      <button onclick="window.openStaff(window._quickStaff)" 
        style="background:none;border:none;color:var(--accent2);font-size:12px;cursor:pointer;text-decoration:underline;">
        → 이 스태프 디테일로 이동
      </button>
    </div>
  </div>
</div>

<!-- 계산기 모달 -->
<div class="calc-modal" id="calcModal" onclick="closeCalc(event)">
  <div class="calc-box">
    <div class="calc-display">
      <div class="calc-expr" id="calcExpr"></div>
      <div class="calc-result" id="calcResult">0</div>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:8px;">
      <button class="btn btn-primary" style="flex:1;" onclick="applyCalc()">✓ 입력</button>
      <button class="btn btn-ghost" style="flex:1;" onclick="document.getElementById('calcModal').classList.remove('show')">취소</button>
    </div>
    <div class="calc-grid">
      <button class="calc-key k-clear" onclick="calcClear()">C</button>
      <button class="calc-key k-op" onclick="calcInput('(')">(</button>
      <button class="calc-key k-op" onclick="calcInput(')')">)</button>
      <button class="calc-key k-op" onclick="calcInput('÷')">÷</button>

      <button class="calc-key k-num" onclick="calcInput('7')">7</button>
      <button class="calc-key k-num" onclick="calcInput('8')">8</button>
      <button class="calc-key k-num" onclick="calcInput('9')">9</button>
      <button class="calc-key k-op" onclick="calcInput('×')">×</button>

      <button class="calc-key k-num" onclick="calcInput('4')">4</button>
      <button class="calc-key k-num" onclick="calcInput('5')">5</button>
      <button class="calc-key k-num" onclick="calcInput('6')">6</button>
      <button class="calc-key k-op" onclick="calcInput('-')">−</button>

      <button class="calc-key k-num" onclick="calcInput('1')">1</button>
      <button class="calc-key k-num" onclick="calcInput('2')">2</button>
      <button class="calc-key k-num" onclick="calcInput('3')">3</button>
      <button class="calc-key k-op" onclick="calcInput('+')">+</button>

      <button class="calc-key k-dash" onclick="calcInput('-dash')">—</button>
      <button class="calc-key k-num" onclick="calcInput('0')">0</button>
      <button class="calc-key k-num" onclick="calcInput('.')">.</button>
      <button class="calc-key k-op" onclick="calcPercent()">%</button>
      <button class="calc-key k-num" style="grid-column:span 2;" onclick="calcDel()">⌫</button>
      <button class="calc-key k-eq" style="grid-column:span 2;" onclick="calcEval()">=</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyC0MehTEqcHuBIHEBjYGbwoirJhYP7Mo6o",
  authDomain: "aplus-sales-ledger.firebaseapp.com",
  databaseURL: "https://aplus-sales-ledger-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "aplus-sales-ledger",
  storageBucket: "aplus-sales-ledger.appspot.com",
  messagingSenderId: "868312671950",
  appId: "1:868312671950:web:abc123"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ── STATE ──────────────────────────────────────────────────
let staffList = []; // [{name, role}]
let currentStaff = '';
let currentMonthKey = '';
let incData = {}; // {rowId: {date, book, juice, beer, food, select, sales}}

// ── INIT ──────────────────────────────────────────────────
const today = new Date();
const thisMonth = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0');
document.getElementById('homeMonth').value = thisMonth;
document.getElementById('homeMonth').addEventListener('change', ()=>{
  renderStaffGrid();
  if(summaryTableVisible) renderSummaryTable();
});

// 매출장부의 스태프/매니저 목록 불러오기
onValue(ref(db,'config/staffList'), snap=>{
  const sNames = snap.exists() ? snap.val() : [];
  onValue(ref(db,'config/managerList'), snap2=>{
    const mNames = snap2.exists() ? snap2.val() : [];
    // 중복 제거하고 role 부여
    const all = [...new Set([...sNames,...mNames])].filter(Boolean).sort();
    staffList = all.map(name=>({ name, role: mNames.includes(name)?'manager':'staff' }));
    renderStaffGrid();
    renderStaffTags();
  },{onlyOnce:true});
},{onlyOnce:true});

// ── SCREEN ────────────────────────────────────────────────
window.showScreen = function(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.getElementById('xlsxBtn').style.display = name==='entry'?'':'none';
};

window.goHome = function(){
  showScreen('home');
  currentStaff = '';
};

// ── MONTH ─────────────────────────────────────────────────
window.setHomeMonth = function(type){
  const t = new Date();
  let mk;
  if(type==='this') mk = t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0');
  else { const d=new Date(t.getFullYear(),t.getMonth()-1,1); mk=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
  document.getElementById('homeMonth').value = mk;
  document.querySelectorAll('.month-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
};

// ── STAFF GRID ────────────────────────────────────────────
function renderStaffGrid(){
  const grid = document.getElementById('staffGrid');
  const monthKey = document.getElementById('homeMonth').value;
  if(!monthKey){ grid.innerHTML='<div style="color:var(--text3);padding:20px;">월을 선택해주세요</div>'; return; }

  const [y,m] = monthKey.split('-').map(Number);
  // 일반 달력 기준: 1일 ~ 말일
  const fromDate = `${y}-${String(m).padStart(2,'0')}-01`;
  const lastDay = new Date(y, m, 0).getDate();
  const toDate = `${y}-${String(m).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;

  grid.innerHTML='<div style="color:var(--text3);font-size:12px;padding:10px 0;">불러오는 중...</div>';

  onValue(ref(db,'records'), snap=>{
    if(!snap.exists()){ grid.innerHTML='<div style="color:var(--text3);padding:20px;">데이터 없음</div>'; return; }

    // 기간 내 레코드에서 부킹자/셀렉션 스태프 집계
    const staffStats = {}; // {name: {bookCnt, selCnt, totalSales}}
    snap.forEach(child=>{
      const r = child.val();
      if(!r.date || r.date < fromDate || r.date > toDate) return;

      // 부킹자
      (r.bookers||[]).filter(s=>s&&s!=='WALKIN').forEach(s=>{
        if(!staffStats[s]) staffStats[s]={bookCnt:0,selCnt:0,totalSales:0};
        staffStats[s].bookCnt++;
        staffStats[s].totalSales += (r.total||0) / ((r.bookers||[]).filter(x=>x&&x!=='WALKIN').length||1);
      });

      // 셀렉션1
      (r.staff||[]).filter(Boolean).forEach(s=>{
        if(!staffStats[s]) staffStats[s]={bookCnt:0,selCnt:0,totalSales:0};
        staffStats[s].selCnt++;
      });
      // 셀렉션2
      (r.staff2||[]).filter(Boolean).forEach(s=>{
        if(!staffStats[s]) staffStats[s]={bookCnt:0,selCnt:0,totalSales:0};
        staffStats[s].selCnt++;
      });
    });

    const activeNames = Object.keys(staffStats).sort();
    if(!activeNames.length){
      grid.innerHTML='<div style="color:var(--text3);padding:20px;font-size:12px;">선택한 월에 실적이 있는 스태프가 없어요</div>';
      return;
    }

    grid.innerHTML = activeNames.map(name=>{
      const s = staffStats[name];
      const isManager = staffList.find(x=>x.name===name)?.role==='manager';
      return `<div class="staff-btn ${isManager?'manager':''}" onclick="openStaff('${name}')">
        ${isManager?'🌟':''}${name}
        <div style="font-size:10px;color:var(--text3);margin-top:4px;">
          ${s.bookCnt>0?`📌 ${s.bookCnt}건`:''}
          ${s.selCnt>0?` ✦ ${s.selCnt}sel`:''}
        </div>
      </div>`;
    }).join('');

    // 전역에 저장 (디테일에서 활용)
    window._staffStats = staffStats;
    window._periodFrom = fromDate;
    window._periodTo = toDate;
  },{onlyOnce:true});
}

// ── OPEN STAFF ────────────────────────────────────────────
window.openStaff = function(name){
  currentStaff = name;
  currentMonthKey = document.getElementById('homeMonth').value;
  const [y,m] = currentMonthKey.split('-').map(Number);
  document.getElementById('entryName').textContent = name;
  document.getElementById('entryMonth').textContent = `${y}년 ${m}월`;
  showScreen('entry');
  loadFromRecords(name);
};

function loadFromRecords(name){
  const fromDate = window._periodFrom;
  const toDate = window._periodTo;

  onValue(ref(db,'records'), snap=>{
    if(!snap.exists()){ loadIncData(); return; }

    // 날짜별 집계 + 부킹자/셀렉션 정보
    const byDate = {};
    const dateRoomInfo = {}; // {date: [{room, bookers, sel1, sel2}]}

    snap.forEach(child=>{
      const r = child.val();
      if(!r.date || r.date < fromDate || r.date > toDate) return;
      const bookers = (r.bookers||[]).filter(s=>s&&s!=='WALKIN');
      const sel1 = (r.staff||[]).filter(Boolean);
      const sel2 = (r.staff2||[]).filter(Boolean);
      const allSel = [...new Set([...sel1,...sel2])];

      // 이 사람이 부킹자이거나 셀렉션인 경우
      const isBooker = bookers.includes(name);
      const isSel = allSel.includes(name);
      if(!isBooker && !isSel) return;

      // 부킹자로 있을 때만 SALES 집계
      if(isBooker){
        const share = (r.total||0) / (bookers.length||1);
        if(!byDate[r.date]) byDate[r.date] = {book:0, sales:0};
        byDate[r.date].book++;
        byDate[r.date].sales += share;
      }

      // 날짜+룸별 정보 저장 (같은 룸 명단용)
      if(!dateRoomInfo[r.date]) dateRoomInfo[r.date] = [];
      dateRoomInfo[r.date].push({
        room: r.room||'?',
        bookers: bookers,
        sel: allSel
      });
    });

    window._dateRoomInfo = dateRoomInfo;

    onValue(ref(db,`incentive/data/${name}/${currentMonthKey}`), snap2=>{
      const saved = snap2.exists() ? snap2.val() : {};
      const newData = {...saved};

      Object.entries(byDate).forEach(([date, {book, sales}])=>{
        const existingId = Object.keys(newData).find(id=>newData[id].date===date);
        if(existingId){
          newData[existingId].book = newData[existingId].book || book;
          newData[existingId].sales = Math.round(sales);
        } else {
          const id = 'r_'+date.replace(/-/g,'');
          newData[id] = {date, sales: Math.round(sales)};
        }
      });

      // 셀렉션만 있는 날짜도 행 추가
      Object.keys(dateRoomInfo).forEach(date=>{
        if(!byDate[date]){
          const existingId = Object.keys(newData).find(id=>newData[id].date===date);
          if(!existingId){
            const id = 's_'+date.replace(/-/g,'');
            newData[id] = {date};
          }
        }
      });

      incData = newData;
      renderTable();
    },{onlyOnce:true});
  },{onlyOnce:true});
}

function loadIncData(){
  const path = `incentive/data/${currentStaff}/${currentMonthKey}`;
  onValue(ref(db,path), snap=>{
    incData = snap.exists() ? snap.val() : {};
    renderTable();
  },{onlyOnce:true});
}

function saveIncData(){
  const path = `incentive/data/${currentStaff}/${currentMonthKey}`;
  set(ref(db,path), incData);
}

// ── TABLE RENDER ──────────────────────────────────────────
const COLS = ['book','juice','beer','food','select','sales'];

function renderTable(){
  const tbody = document.getElementById('incBody');
  const rows = Object.entries(incData).sort((a,b)=>a[1].date?.localeCompare(b[1].date||'')||0);

  tbody.innerHTML = rows.map(([id,row])=>{
    const date = row.date||'';
    const roomInfo = (window._dateRoomInfo||{})[date]||[];

    // 부킹자/셀렉션 정보 패널
    let infoHtml='';
    if(roomInfo.length){
      const bookerSet = new Set(), selSet = new Set();
      roomInfo.forEach(r=>{
        r.bookers.forEach(b=>{ if(b!==currentStaff) bookerSet.add(b); });
        r.sel.forEach(s=>{ if(s!==currentStaff) selSet.add(s); });
      });
      // 현재 스태프 본인도 포함
      roomInfo.forEach(r=>{
        if(r.bookers.includes(currentStaff)) r.bookers.forEach(b=>bookerSet.add(b));
        if(r.sel.includes(currentStaff)) r.sel.forEach(s=>selSet.add(s));
      });

      const bookerNames=[...bookerSet].filter(Boolean);
      const selNames=[...selSet].filter(Boolean);

      const makeStaffBtn=(name)=>`<button onclick="window.quickInputModal('${name}','${date}')"
        style="background:var(--bg4);border:1px solid var(--border);border-radius:12px;padding:2px 8px;font-size:10px;color:var(--text2);cursor:pointer;margin:1px;">
        ${name}
      </button>`;

      infoHtml=`<td colspan="8" style="padding:4px 8px;background:rgba(124,111,247,0.04);border-top:none;">
        <div style="font-size:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
          ${bookerNames.length?`<span style="color:var(--accent2);">📌 부킹:</span> ${bookerNames.map(makeStaffBtn).join('')}`:''}
          ${selNames.length?`<span style="color:var(--yellow);">✦ 셀렉션:</span> ${selNames.map(makeStaffBtn).join('')}`:''}
        </div>
      </td>`;
    }

    return `<tr id="row-${id}">
      <td>${date||'-'}</td>
      ${COLS.map(col=>{
        const isAuto = col==='sales';
        return `<td>
          <input class="cell-input" type="text" value="${row[col]||''}"
            onchange="updateCell('${id}','${col}',this.value)"
            onfocus="this.select()"
            inputmode="decimal"
            ${isAuto?'readonly style="color:var(--green);cursor:default;"':''}>
          ${!isAuto?`<button class="calc-trigger" onclick="openCalc('${id}','${col}',this.previousElementSibling)">⌗</button>`:''}
        </td>`;
      }).join('')}
      <td><button onclick="deleteRow('${id}')" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:14px;padding:6px;">✕</button></td>
    </tr>
    ${infoHtml?`<tr>${infoHtml}</tr>`:''}`;
  }).join('');

  renderTotals();
  renderSummary();
}

function renderTotals(){
  COLS.forEach(col=>{
    const tot = Object.values(incData).reduce((s,r)=>{
      const v = parseFloat(String(r[col]||'').replace(/[^0-9.\-]/g,''))||0;
      return s+v;
    },0);
    const el = document.getElementById('tot-'+col);
    if(el) el.textContent = tot>0 ? tot.toLocaleString() : '-';
  });
}

function renderSummary(){
  const grid = document.getElementById('sumGrid');
  const labels = {book:'BOOK',juice:'JUICE',beer:'BEER',food:'FOOD',select:'SELECT'};
  const colors = {book:'var(--accent2)',juice:'var(--blue)',beer:'var(--yellow)',food:'var(--green)',select:'var(--orange)'};
  const incCols = ['book','juice','beer','food','select'];

  // 항목별 합계
  const tots = {};
  COLS.forEach(col=>{
    tots[col] = Object.values(incData).reduce((s,r)=>{
      return s+(parseFloat(String(r[col]||'').replace(/[^0-9.\-]/g,''))||0);
    },0);
  });
  const incTotal = incCols.reduce((s,col)=>s+tots[col],0);

  grid.innerHTML = incCols.map(col=>`
    <div class="sum-card">
      <div class="sum-label">${labels[col]}</div>
      <div class="sum-value" style="color:${colors[col]};font-size:14px;">${tots[col]>0?tots[col].toLocaleString():'-'}</div>
    </div>`).join('')+`
    <div class="sum-card" style="border-color:var(--accent);background:rgba(124,111,247,0.08);">
      <div class="sum-label" style="color:var(--accent2);">💰 인센티브 합계</div>
      <div class="sum-value" style="color:var(--accent2);font-size:16px;">${incTotal>0?incTotal.toLocaleString():'-'}</div>
      <div style="font-size:10px;color:var(--text3);margin-top:4px;">SALES: ${tots['sales']>0?tots['sales'].toLocaleString():'-'}</div>
    </div>`;
}

window.addRow = function(){

  const id = Date.now().toString();
  incData[id] = {date: fullDate};
  saveIncData();
  renderTable();
};

window.updateCell = function(id, col, val){
  if(!incData[id]) return;
  incData[id][col] = val;
  saveIncData();
  renderTotals();
  renderSummary();
};

window.deleteRow = function(id){
  if(!confirm('이 행을 삭제할까요?')) return;
  delete incData[id];
  saveIncData();
  renderTable();
};

// ── CALCULATOR ────────────────────────────────────────────
let calcExpr = '';
let calcTargetInput = null;
let calcTargetId = '';
let calcTargetCol = '';

window.openCalc = function(id, col, input){
  calcTargetInput = input;
  calcTargetId = id;
  calcTargetCol = col;
  calcExpr = input.value || '';
  document.getElementById('calcExpr').textContent = calcExpr;
  document.getElementById('calcResult').textContent = calcExpr || '0';
  document.getElementById('calcModal').classList.add('show');
};

window.closeCalc = function(e){
  if(e.target===document.getElementById('calcModal'))
    document.getElementById('calcModal').classList.remove('show');
};

window.calcInput = function(v){
  if(v==='-dash'){ calcExpr='-'; }
  else { calcExpr += v; }
  document.getElementById('calcExpr').textContent = calcExpr;
  try{
    const expr = calcExpr.replace(/×/g,'*').replace(/÷/g,'/');
    const result = eval(expr);
    if(!isNaN(result)) document.getElementById('calcResult').textContent = result.toLocaleString();
  }catch(e){}
};

window.calcPercent = function(){
  try{
    const expr = calcExpr.replace(/×/g,'*').replace(/÷/g,'/');
    const result = eval(expr);
    if(!isNaN(result)){
      calcExpr = String(result/100);
      document.getElementById('calcResult').textContent = (result/100).toLocaleString();
      document.getElementById('calcExpr').textContent = '';
    }
  }catch(e){}
};

window.calcDel = function(){
  calcExpr = calcExpr.slice(0,-1);
  document.getElementById('calcExpr').textContent = calcExpr;
  document.getElementById('calcResult').textContent = calcExpr||'0';
};

window.calcClear = function(){
  calcExpr='';
  document.getElementById('calcExpr').textContent='';
  document.getElementById('calcResult').textContent='0';
};

window.calcEval = function(){
  try{
    const expr = calcExpr.replace(/×/g,'*').replace(/÷/g,'/');
    const result = eval(expr);
    if(!isNaN(result)){
      calcExpr = String(result);
      document.getElementById('calcResult').textContent = result.toLocaleString();
      document.getElementById('calcExpr').textContent = '';
    }
  }catch(e){}
};

window.applyCalc = function(){
  try{
    const expr = calcExpr.replace(/×/g,'*').replace(/÷/g,'/');
    let val = calcExpr==='-' ? '-' : eval(expr);
    if(calcTargetInput){
      calcTargetInput.value = calcExpr==='-' ? '-' : String(val);
      updateCell(calcTargetId, calcTargetCol, calcTargetInput.value);
    }
    document.getElementById('calcModal').classList.remove('show');
  }catch(e){ showToast('계산 오류'); }
};

// 엑셀 형식: A열=날짜(YYYY-MM-DD 또는 M/D), B열=BOOK금액
// ── 빠른 입력 모달 ──────────────────────────────────────
window._quickStaff = '';
window._quickDate = '';
window._quickInputs = {};

window.quickInputModal = function(staffName, date){
  window._quickStaff = staffName;
  window._quickDate = date;
  window._quickInputs = {};

  document.getElementById('quickModalTitle').textContent = staffName;
  document.getElementById('quickModalDate').textContent = date;

  // 기존 저장된 값 불러오기
  onValue(ref(db,`incentive/data/${staffName}/${currentMonthKey}`), snap=>{
    const saved = snap.exists() ? snap.val() : {};
    const existRow = Object.values(saved).find(r=>r.date===date)||{};

    const MANUAL_COLS = ['book','juice','beer','food','select'];
    const labels = {book:'BOOK',juice:'JUICE',beer:'BEER',food:'FOOD',select:'SELECT'};
    document.getElementById('quickModalFields').innerHTML = MANUAL_COLS.map(col=>`
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="width:60px;font-size:12px;color:var(--text3);font-weight:600;">${labels[col]}</span>
        <input type="number" id="qi_${col}" value="${existRow[col]||''}" placeholder="0"
          style="flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-size:14px;padding:6px 10px;text-align:right;"
          inputmode="decimal"
          onchange="window._quickInputs['${col}']=this.value">
      </div>`).join('');

    // 현재 값 초기화
    MANUAL_COLS.forEach(col=>{
      window._quickInputs[col] = existRow[col]||'';
    });

    document.getElementById('quickModal').classList.add('show');
  },{onlyOnce:true});
};

window.closeQuickModal = function(e){
  if(e.target===document.getElementById('quickModal'))
    document.getElementById('quickModal').classList.remove('show');
};

window.saveQuickInput = function(){
  const staffName = window._quickStaff;
  const date = window._quickDate;
  const MANUAL_COLS = ['book','juice','beer','food','select'];

  // 입력값 수집
  const vals = {};
  MANUAL_COLS.forEach(col=>{
    const el = document.getElementById('qi_'+col);
    if(el && el.value) vals[col] = el.value;
  });

  // Firebase에서 기존 데이터 가져와서 병합
  onValue(ref(db,`incentive/data/${staffName}/${currentMonthKey}`), snap=>{
    const saved = snap.exists() ? snap.val() : {};
    const newData = {...saved};
    const existId = Object.keys(newData).find(id=>newData[id].date===date);
    if(existId){
      Object.assign(newData[existId], vals);
    } else {
      newData['q_'+date.replace(/-/g,'')+Math.random().toString(36).slice(2,5)] = {date, ...vals};
    }
    set(ref(db,`incentive/data/${staffName}/${currentMonthKey}`), newData);
    document.getElementById('quickModal').classList.remove('show');
    showToast(`✓ ${staffName} ${date} 저장됨`);
  },{onlyOnce:true});
};

window.loadBookXlsx = function(input){
  const file = input.files[0]; if(!file) return;
  loadXLSX(()=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const wb = window.XLSX.read(e.target.result, {type:'array', cellDates:false});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const raw = window.XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
      const [y,m] = currentMonthKey.split('-').map(Number);
      let updated = 0;
      raw.forEach(row=>{
        if(!row[0]||!row[1]) return;
        // 날짜 파싱
        let dateStr='';
        const v = String(row[0]).trim();
        const mSlash = v.match(/^(\d+)\/(\d+)/);
        if(mSlash){
          dateStr=`${y}-${String(parseInt(mSlash[1])).padStart(2,'0')}-${String(parseInt(mSlash[2])).padStart(2,'0')}`;
        } else if(typeof row[0]==='number' && row[0]>40000){
          const ms=(row[0]-25569)*86400*1000+19800000;
          const d=new Date(ms);
          dateStr=`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
        } else if(v.match(/^\d{4}-\d{2}-\d{2}/)){
          dateStr=v.slice(0,10);
        }
        if(!dateStr) return;
        const amt = parseFloat(String(row[1]).replace(/[^0-9.\-]/g,''))||0;
        if(!amt) return;
        // 해당 날짜 row 찾아서 업데이트
        const existId = Object.keys(incData).find(id=>incData[id].date===dateStr);
        if(existId){
          incData[existId].book = amt;
        } else {
          incData['b_'+dateStr.replace(/-/g,'')] = {date:dateStr, book:amt};
        }
        updated++;
      });
      if(!updated){ showToast('⚠ 유효한 데이터 없음'); input.value=''; return; }
      saveIncData();
      renderTable();
      showToast(`✓ BOOK ${updated}건 업로드 완료!`);
      input.value='';
    };
    reader.readAsArrayBuffer(file);
  });
};

              <td style="${tdS}color:var(--blue);">${r.juice?r.juice.toLocaleString():'-'}</td>

              <td style="${tdS}color:var(--green);">${r.food?r.food.toLocaleString():'-'}</td>
              <td style="${tdS}color:var(--orange);">${r.select?r.select.toLocaleString():'-'}</td>
              <td style="${tdS}color:var(--accent);font-weight:700;border-left:2px solid var(--accent);">${r.incTotal?r.incTotal.toLocaleString():'-'}</td>
              <td style="${tdS}color:var(--red);">${r.sales?r.sales.toLocaleString():'-'}</td>
            </tr>`).join('')}
          </tbody>
          <tfoot>
            <tr style="background:var(--bg3);">
              <td style="${tdN}color:var(--text3);">합계</td>
              <td style="${tdS}font-weight:700;">${grandTot.book?grandTot.book.toLocaleString():'-'}</td>
              <td style="${tdS}font-weight:700;">${grandTot.juice?grandTot.juice.toLocaleString():'-'}</td>
              <td style="${tdS}font-weight:700;">${grandTot.beer?grandTot.beer.toLocaleString():'-'}</td>
              <td style="${tdS}font-weight:700;">${grandTot.food?grandTot.food.toLocaleString():'-'}</td>
              <td style="${tdS}font-weight:700;">${grandTot.select?grandTot.select.toLocaleString():'-'}</td>
              <td style="${tdS}font-weight:700;color:var(--accent);border-left:2px solid var(--accent);">${grandTot.incTotal?grandTot.incTotal.toLocaleString():'-'}</td>
              <td style="${tdS}font-weight:700;color:var(--red);">${grandTot.sales?grandTot.sales.toLocaleString():'-'}</td>
            </tr>
          </tfoot>
        </table>
      </div>`;
  },{onlyOnce:true});
}

window.downloadAllXlsx = function(){
  const monthKey = document.getElementById('homeMonth').value;
  if(!monthKey){ showToast('월을 선택해주세요'); return; }
  const [y,m] = monthKey.split('-').map(Number);

  loadXLSX(()=>{
    showToast('데이터 불러오는 중...');
    onValue(ref(db,'incentive/data'), snap=>{
      const allData = snap.exists() ? snap.val() : {};
      const INC_COLS = ['book','juice','beer','food','select'];
      const labels = {book:'BOOK',juice:'JUICE',beer:'BEER',food:'FOOD',select:'SELECT'};

      // 알파벳순 정렬
      const names = Object.keys(allData).filter(name=>{
        const md = allData[name]?.[monthKey];
        return md && Object.keys(md).length>0;
      }).sort();

      if(!names.length){ showToast('⚠ 해당 월 데이터 없음'); return; }

      // 헤더
      const headerRow = ['이름','BOOK','JUICE','BEER','FOOD','SELECT','💰 인센티브합계','SALES'];
      const rows = [
        [`${y}년 ${m}월 스태프 인센티브 전체`],
        [],
        headerRow
      ];

      names.forEach(name=>{
        const md = allData[name]?.[monthKey]||{};
        const tots = {};
        INC_COLS.forEach(col=>{
          tots[col] = Object.values(md).reduce((s,r)=>
            s+(parseFloat(String(r[col]||'').replace(/[^0-9.-]/g,''))||0),0);
        });
        const incTotal = INC_COLS.reduce((s,col)=>s+tots[col],0);
        const salesTot = Object.values(md).reduce((s,r)=>
          s+(parseFloat(String(r['sales']||'').replace(/[^0-9.-]/g,''))||0),0);

        rows.push([
          name,
          tots['book']||'',
          tots['juice']||'',
          tots['beer']||'',
          tots['food']||'',
          tots['select']||'',
          incTotal||'',
          salesTot||''
        ]);
      });

      // 합계행
      const totRow = ['합계'];
      [...INC_COLS,'incTotal','sales'].forEach((col,i)=>{
        if(col==='incTotal'){
          const t = names.reduce((s,name)=>{
            const md=allData[name]?.[monthKey]||{};
            return s+INC_COLS.reduce((ss,c)=>ss+(parseFloat(String(Object.values(md).reduce((sv,r)=>sv+(parseFloat(String(r[c]||'').replace(/[^0-9.-]/g,''))||0),0))||0)),0);
          },0);
          totRow.push(t||'');
        } else {
          const t = names.reduce((s,name)=>{
            const md=allData[name]?.[monthKey]||{};
            return s+Object.values(md).reduce((ss,r)=>ss+(parseFloat(String(r[col]||'').replace(/[^0-9.-]/g,''))||0),0);
          },0);
          totRow.push(t||'');
        }
      });
      rows.push([]);
      rows.push(totRow);

      const wb = window.XLSX.utils.book_new();
      const ws = window.XLSX.utils.aoa_to_sheet(rows);
      ws['!cols']=[{wch:14},{wch:10},{wch:10},{wch:10},{wch:10},{wch:10},{wch:14},{wch:12}];
      window.XLSX.utils.book_append_sheet(wb, ws, `${y}-${String(m).padStart(2,'0')}`);
      window.XLSX.writeFile(wb, `전체인센티브_${monthKey}.xlsx`);
      showToast('✓ 전체 엑셀 다운로드 완료!');
    },{onlyOnce:true});
  });
};

window.downloadXlsxSingle = function(){
  loadXLSX(()=>{
    const [y,m] = currentMonthKey.split('-').map(Number);
    const rows = Object.values(incData).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    const data = [
      [`${currentStaff} - ${y}년 ${m}월 인센티브`],
      [],
      ['DATE','BOOK','JUICE','BEER','FOOD','SELECT','SALES']
    ];
    rows.forEach(r=>data.push([r.date||'',r.book||'',r.juice||'',r.beer||'',r.food||'',r.select||'',r.sales||'']));
    // 합계
    const totRow = ['합계'];
    COLS.forEach(col=>{
      const t=Object.values(incData).reduce((s,r)=>s+(parseFloat(String(r[col]||'').replace(/[^0-9.\-]/g,''))||0),0);
      totRow.push(t||'');
    });
    data.push([]);
    data.push(totRow);
    const wb=window.XLSX.utils.book_new();
    const ws=window.XLSX.utils.aoa_to_sheet(data);
    ws['!cols']=[{wch:14},{wch:10},{wch:10},{wch:10},{wch:10},{wch:10},{wch:12}];
    window.XLSX.utils.book_append_sheet(wb,ws,currentStaff);
    window.XLSX.writeFile(wb,`${currentStaff}_${currentMonthKey}_incentive.xlsx`);
    showToast('✓ 엑셀 다운로드 완료!');
  });
};

window.showToast = function(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
};
